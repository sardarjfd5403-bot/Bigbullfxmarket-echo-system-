name: Tests and package build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Build distributions
        run: python -m build
