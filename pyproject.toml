[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bigbulls-ai"
version = "0.1.0"
description = "Risk-controlled multi-asset trading intelligence research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.scripts]
bigbulls-license = "bigbulls_ai.license_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]
mt5 = ["MetaTrader5>=5.0.45; platform_system == \"Windows\""]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
